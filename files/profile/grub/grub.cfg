insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod png
insmod jpeg
insmod gfxterm
insmod gfxmenu

if loadfont "($root)/boot/grub/themes/CambonOS/unifont-regular-16.pf2"; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set theme="($root)/boot/grub/themes/CambonOS/theme.txt"
set default=0
set timeout=10
set timeout_style=menu

menuentry "CambonOS Installer (%ARCH%, UEFI)" --class arch --class gnu-linux --class gnu --class os --id 'cambonos-installer' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
    fwsetup
}

menuentry 'System restart' --class reboot --class restart {
    reboot
}

menuentry 'System shutdown' --class shutdown --class poweroff {
    halt
}